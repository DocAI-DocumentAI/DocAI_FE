name: Build and Deploy to Firebase Hosting

on:
  push:
    branches: [main] # Chỉ chạy khi push vào main
  pull_request:
    branches: [main] # Chạy khi tạo PR vào main

jobs:
  # Job này chạy cho pull requests - chỉ build để kiểm tra
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true
        env:
          CI: false

      - name: Build React app (test only)
        run: npm run build
        env:
          CI: false

  # Job này chỉ chạy khi push vào main - build và deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true
        env:
          CI: false

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: docai-31e37
          # entryPoint: ./DocAI
